name: CI — baseline vs advanced

# Runs automatically the moment code is pushed (or a PR opened) against
# main/master. This is the judge-facing reproducibility check: it proves
# the project runs from a clean environment with no manual steps.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: {}   # lets a judge re-trigger manually from the Actions tab

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run baseline vs advanced comparison
        run: |
          python eval/harness.py \
            --baseline baseline/ \
            --advanced advanced/ \
            --cases eval/cases/ \
            --out eval/results/ci-latest.json

      - name: Upload comparison result
        if: always()   # keep the artifact even if the run above fails, so judges can see why
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/ci-latest.json
          if-no-files-found: warn
